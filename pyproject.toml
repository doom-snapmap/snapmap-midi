# Packaging metadata for snapmap-midi.
#
# src/ layout: the package is not importable from the repository root without
# an install, so a green suite proves the INSTALLED package works rather than
# just the checkout.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snapmap-midi"
version = "0.2.0"
description = "Compile a standard MIDI file into a playable in-game music map for DOOM (2016)'s SnapMap editor."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "mido>=1.3,<2",
    # Windows-only: the loader folder this tool writes to is Windows-only, so a
    # window elsewhere has nothing to hand its output to. The [ui] extra exists
    # for anyone who wants it anyway.
    "pywebview>=5.1; sys_platform == 'win32'",
]

[project.scripts]
snapmap-midi = "snapmap_midi.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.6"]
ui = ["pywebview>=5.1"]

[tool.setuptools]
package-dir = { "" = "src" }
packages = [
    "snapmap_midi",
    "snapmap_midi.rawmap",
    "snapmap_midi.sound",
    "snapmap_midi.music",
    "snapmap_midi.audio",
    "snapmap_midi.ui",
]

# Spelled against the `snapmap_midi.ui` package rather than as a `ui/web/*`
# glob under `snapmap_midi`. The glob form reaches into a directory that is
# itself a declared package and is unreliable; the failure mode is a wheel that
# installs a window with no markup, which renders as a blank page with no error.
[tool.setuptools.package-data]
snapmap_midi = ["data/*.json"]
"snapmap_midi.ui" = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "savedmap: needs a saved baseline map; skipped when unconfigured",
    "gamedata: needs a real game install to read audio from; skipped when none is found",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Deliberately narrow: correctness and import hygiene only. Broadening to UP/B
# is welcome as its own pull request -- it was kept out of the initial commit
# so that any movement in a byte gate would have exactly one possible cause.
select = ["E", "F", "I"]
