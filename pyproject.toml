# Packaging metadata for snapmap-midi.
#
# src/ layout: the package is not importable from the repository root without
# an install, so a green suite proves the INSTALLED package works rather than
# just the checkout.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snapmap-midi"
version = "0.1.0"
description = "Compile a standard MIDI file into a playable in-game music map for DOOM (2016)'s SnapMap editor."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["mido>=1.3,<2"]

[project.scripts]
snapmap-midi = "snapmap_midi.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
package-dir = { "" = "src" }
packages = [
    "snapmap_midi",
    "snapmap_midi.rawmap",
    "snapmap_midi.sound",
    "snapmap_midi.music",
]

[tool.setuptools.package-data]
snapmap_midi = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["savedmap: needs a saved baseline map; skipped when unconfigured"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Deliberately narrow: correctness and import hygiene only. Broadening to UP/B
# is welcome as its own pull request -- it was kept out of the initial commit
# so that any movement in a byte gate would have exactly one possible cause.
select = ["E", "F", "I"]
