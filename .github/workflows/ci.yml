# Two gates on every pull request:
#   - a secretless guard that a fork PR can run safely (read-only token, no repo secrets), and
#   - a test matrix on both platforms contributors actually use.
# Third-party actions are pinned to full commit SHAs, not tags: a tag is mutable.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    name: Guard (secretless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: No game data
        # The most important guard here: this repo is public and the game's own data is not
        # ours to redistribute. A real map is plain ASCII JSON, so the binary check below
        # cannot see it -- it has to be caught by content.
        run: |
          set -euo pipefail
          if git ls-files '*.decl' | grep . ; then
            echo "::error::declaration files are game data and must never be committed"
            exit 1
          fi
          # These two byte fixtures are the ONLY JSON allowed to look map-shaped.
          # (tiny.mid is not JSON; the binary step below covers it.)
          allowed="tests/fixtures/tiny_song_default.json tests/fixtures/tiny_song_hermetic.json"
          for f in $(git ls-files '*.json'); do
            case " $allowed " in *" $f "*) continue ;; esac
            # Process substitution, not a pipe: `grep -q` exits on first match, `head` then
            # takes SIGPIPE, and pipefail would turn a real HIT into a false miss.
            if grep -q '"entities"' <(head -c 2000 "$f") ; then
              echo "::error::$f looks like a game map -- game data must not be committed"
              exit 1
            fi
          done
          echo "no game data found"

      - name: No unexpected binaries
        run: |
          set -euo pipefail
          allowed="tests/fixtures/tiny.mid"
          for f in $(git ls-files); do
            if file --mime "$f" | grep -q 'charset=binary'; then
              case " $allowed " in
                *" $f "*) ;;
                *) echo "::error::unexpected binary: $f" ; exit 1 ;;
              esac
            fi
          done
          echo "binaries limited to the allow-listed MIDI fixture"

      - name: Secret scan (gitleaks)
        # gitleaks-action@v2 requires a PAID license for organizations; the gitleaks BINARY is
        # free. Pinned version (reproducible + supply-chain friendly). --exit-code 1 fails the
        # job on any leak.
        run: |
          VER=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --no-git --source . --redact --no-banner --exit-code 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Structural guards (layering, no network client, protected surface)
        # These assert properties of the repository rather than of any function: the authoring
        # core imports no music module, no shipped module reaches for a network client, and the
        # protected method names have not been renamed out from under a downstream author.
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest tests/test_document.py -v -k "import or network or surface"

  test:
    name: Test (Windows + Ubuntu)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Test
        run: python -m pytest -q

      - name: Assert the game-data tests skipped rather than vanished
        shell: bash
        run: |
          set -euo pipefail
          # Public CI has no game data, so these MUST skip. Asserting the count catches a test
          # that silently became a no-op instead of one that correctly skipped.
          # Captured in a variable rather than a temp file: nothing here should leave a
          # stray artifact in the workspace for the guard job to trip over.
          out="$(python -m pytest -q -m gamedata 2>&1)"
          echo "$out"
          case "$out" in
            *"5 skipped"*) echo "game-data tests skipped as expected" ;;
            *) echo "::error::expected exactly 5 game-data tests to skip" ; exit 1 ;;
          esac
