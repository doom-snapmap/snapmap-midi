# Two dependency surfaces here: the SHA-pinned GitHub Actions, and pip -- `mido` is a real
# runtime dependency of a MIDI compiler, so it is worth watching as well as the workflows.
#
# When an action publishes a new release Dependabot opens a PR updating the pinned commit SHA
# (and its version comment), so the pins stay both immutable and up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
